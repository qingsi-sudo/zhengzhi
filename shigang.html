<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="考研政治史纲地图时间轴：拖动时间轴看地图演示，分级标注必背重点，专题串线和闯关测验。"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>史纲地图时间轴</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 布局：顶栏 / 地图舞台 + 右侧知识卡 / 底部可拖动时间轴。深色“夜图”单主题，刻意固定。 */
:root{
  color-scheme:dark;
  --ink:#0e1013; --stage:#121519; --panel:#15181d; --raise:#1c2026; --line:#2a2f37; --line2:#363c46;
  --land:#20242a; --land-hi:#272c33; --border:#3a414b;
  --fg:#ece6d8; --fg2:#bdb6a6; --muted:#857f72;
  --gold:#e0a84e; --red:#de5a43; --blue:#79acd9; --jade:#5fbf9d;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top" "map side" "tl tl"}
/* ---------- 顶栏 ---------- */
.top{grid-area:top;display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;padding-block:10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--ink)}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font-family:var(--serif);font-weight:900;font-size:17px;letter-spacing:.06em}
.brand b i{font-style:normal;color:var(--gold)}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.14em}
.search{position:relative;flex:0 1 230px;min-width:150px}
.search input{width:100%;box-sizing:border-box;background:var(--raise);border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:7px 30px 7px 10px;font:inherit;font-size:13px}
.search input::placeholder{color:var(--muted)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:3px;padding:0 4px;font-family:var(--sans)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:0 18px 40px rgba(0,0,0,.5);max-height:60vh;overflow:auto;z-index:30;padding:4px}
.results button{display:grid;grid-template-columns:72px 1fr;gap:8px;width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:5px;cursor:pointer;font-size:13px}
.results button:hover,.results button.on{background:var(--raise)}
.results .d{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.results .empty{padding:10px;color:var(--muted);font-size:13px}
.eras{display:flex;gap:2px;flex-wrap:wrap}
.chip{background:none;border:0;padding:5px 9px;border-radius:5px;cursor:pointer;color:var(--fg2);font-size:13px;white-space:nowrap}
.chip:hover{background:var(--raise)}
.chip[aria-pressed=true]{color:var(--fg);background:var(--raise);box-shadow:inset 0 -2px 0 var(--gold)}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tog{display:inline-flex;align-items:center;gap:6px;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px;color:var(--fg2);white-space:nowrap}
.tog[aria-pressed=true]{border-color:var(--gold);color:var(--fg)}
.tog .dot{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.tog[aria-pressed=true] .dot{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.prog{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.prog b{color:var(--fg);font-weight:500}
/* ---------- 地图舞台 ---------- */
.stage{grid-area:map;position:relative;overflow:hidden;background:radial-gradient(ellipse at 55% 45%,#171b21 0%,var(--stage) 60%,var(--ink) 100%);min-height:0}
.stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.28;pointer-events:none}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#map.drag{cursor:grabbing}
.prov{fill:var(--land);stroke:var(--border);stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .4s}
.prov:hover{fill:var(--land-hi)}
.nh{fill:none;stroke:var(--border);stroke-width:.8;vector-effect:non-scaling-stroke}
.plabel{fill:var(--muted);opacity:.5;font-family:var(--sans);pointer-events:none;text-anchor:middle}
.hl{pointer-events:none;transition:opacity .5s}
.route{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.route.faint{stroke:var(--fg2);opacity:.16;stroke-width:1.2;stroke-dasharray:3 4}
.route.now{stroke-width:2.6;filter:drop-shadow(0 0 4px currentColor)}
.pd{cursor:pointer}
.pd circle.c{transition:r .3s}
.lab{font-family:var(--sans);font-weight:700;paint-order:stroke;stroke:var(--ink);stroke-linejoin:round;pointer-events:none}
@keyframes pulse{from{opacity:.9;transform:scale(.4)}to{opacity:0;transform:scale(2.6)}}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite;fill:none;stroke-width:1.4;vector-effect:non-scaling-stroke;pointer-events:none}
.hud{position:absolute;left:max(22px,env(safe-area-inset-left,0px));top:16px;pointer-events:none;max-width:60%}
.yr{font-family:var(--serif);font-weight:900;font-size:clamp(54px,8.2vw,124px);line-height:.95;letter-spacing:-.01em;color:var(--fg);font-variant-numeric:tabular-nums;text-shadow:0 2px 30px rgba(0,0,0,.6)}
.yr small{font-size:.28em;color:var(--fg2);font-weight:600;margin-left:.25em;letter-spacing:.02em}
.hud .rule{width:84px;height:2px;background:var(--gold);margin:12px 0 10px}
.hud .era{font-size:15px;font-weight:700;color:var(--gold);letter-spacing:.12em}
.hud .seg{font-size:12px;color:var(--fg2);letter-spacing:.08em;margin-top:2px}
.abroad{position:absolute;right:16px;top:40px;display:flex;align-items:center;gap:8px;background:rgba(21,24,29,.9);border:1px solid var(--line2);border-radius:999px;padding:5px 12px 5px 8px;font-size:12px;color:var(--fg2)}
.abroad i{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--raise);color:var(--gold);font-size:11px}
.legend{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:14px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 160px)}
.lg{display:inline-flex;align-items:center;gap:6px;background:rgba(21,24,29,.82);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;color:var(--fg2);cursor:pointer}
.lg i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.lg[aria-pressed=false]{opacity:.38}
.lg[aria-pressed=false] i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.zoom{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:14px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;border-radius:6px;background:rgba(21,24,29,.9);border:1px solid var(--line2);cursor:pointer;font-size:15px;color:var(--fg2);display:grid;place-items:center;padding:0}
.zoom button:hover{color:var(--fg);border-color:var(--muted)}
.mapnote{position:absolute;right:16px;top:14px;font-size:10.5px;color:var(--muted);opacity:.75;text-align:right;pointer-events:none;line-height:1.4}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:6px 9px;font-size:12px;z-index:20;max-width:240px;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.tip b{display:block;font-size:13px;color:var(--fg)}
.tip span{color:var(--muted)}
/* ---------- 知识卡 ---------- */
.side{grid-area:side;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.card{flex:1;overflow:auto;padding:20px 22px 12px;min-height:0;overscroll-behavior:contain}
.crumb{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);letter-spacing:.06em}
.crumb .date{color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.ttl{font-family:var(--serif);font-weight:900;font-size:27px;line-height:1.3;margin:10px 0 12px;text-wrap:balance;letter-spacing:.02em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag{font-size:12px;border:1px solid var(--line2);border-radius:4px;padding:1px 8px;color:var(--fg2);background:none}
.tag.k{border-color:currentColor;font-weight:500}
button.tag{cursor:pointer}
button.tag:hover{border-color:var(--muted);color:var(--fg)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:6px}
.acts button{background:none;border:0;border-right:1px solid var(--line);padding:8px 4px;font-size:12.5px;color:var(--fg2);cursor:pointer}
.acts button:last-child{border-right:0}
.acts button:hover{background:var(--raise);color:var(--fg)}
.acts button[aria-pressed=true]{color:var(--gold)}
.sec{padding:14px 0 4px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--red)}
.sec h3.g{color:var(--gold)} .sec h3.b{color:var(--blue)} .sec h3.m{color:var(--muted)}
.pts{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.pts li{position:relative;padding-left:14px;font-size:14px;line-height:1.65;color:var(--fg)}
.pts li::before{content:"";position:absolute;left:2px;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.pts li .lb{color:var(--gold);font-weight:700}
mark{background:none;color:var(--gold);font-weight:700;border-bottom:1px solid rgba(224,168,78,.4);padding:0 1px;transition:color .2s,background .2s}
.blank mark{color:transparent;background:rgba(224,168,78,.16);border-radius:3px;border-bottom-color:var(--gold);cursor:pointer;user-select:none}
.blank mark.show{color:var(--gold);background:none}
.contra{font-size:14px;line-height:1.7;font-weight:500}
.errbox{background:rgba(222,90,67,.08);border:1px solid rgba(222,90,67,.3);border-radius:6px;padding:10px 12px;font-size:14px;line-height:1.7}
.list{display:grid;gap:1px}
.list button{display:grid;grid-template-columns:76px 1fr;gap:8px;text-align:left;background:none;border:0;border-radius:4px;padding:5px 6px;cursor:pointer;font-size:13px;color:var(--fg2)}
.list button:hover{background:var(--raise);color:var(--fg)}
.list button.on{background:var(--raise);color:var(--fg);box-shadow:inset 2px 0 0 var(--gold)}
.list button .d{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.list button .rd{color:var(--jade)}
.nav{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.nav button{background:none;border:0;text-align:left;padding:12px 18px;cursor:pointer;min-width:0}
.nav button+button{border-left:1px solid var(--line);text-align:right}
.nav button:hover{background:var(--raise)}
.nav button:disabled{opacity:.35;cursor:default;background:none}
.nav small{display:block;font-size:11px;color:var(--muted);letter-spacing:.12em}
.nav span{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src{padding:10px 22px 14px;font-size:11px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line)}
/* ---------- 地图演示层 ---------- */
.co .full{transition:opacity .35s}
.co .mini{opacity:0;transition:opacity .35s}
.co.small .full{animation:none;opacity:0;pointer-events:none}
.co.small .mini{opacity:1}
.co .box{fill:var(--panel);fill-opacity:.94}
.co text{font-family:var(--sans)}
@keyframes popIn{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
.co .full{transform-box:fill-box;animation:popIn .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes dropIn{0%{opacity:0;transform:translateY(-14px) scale(1.6)}70%{opacity:1;transform:translateY(0) scale(.9)}100%{transform:scale(1)}}
.mk{transform-box:fill-box;transform-origin:center;animation:dropIn .5s ease-out both}
@keyframes hlFlash{0%{fill-opacity:0}35%{fill-opacity:.7}100%{fill-opacity:var(--fo)}}
.hl.anim{animation:hlFlash 1.2s ease-out both}
.flash{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:40px;width:min(320px,42%);background:rgba(21,24,29,.93);border:1px solid var(--line2);border-radius:8px;padding:12px 14px 13px;box-shadow:0 16px 40px rgba(0,0,0,.45);pointer-events:auto}
.flash .fk{font-size:11px;letter-spacing:.18em;font-weight:700}
.flash .ft{font-family:var(--serif);font-weight:900;font-size:19px;line-height:1.35;margin:4px 0 10px;text-wrap:balance}
.flash .kw{display:flex;flex-wrap:wrap;gap:6px}
.flash .kw span{font-size:13px;font-weight:700;padding:3px 9px;border-radius:4px;border:1.5px solid currentColor;cursor:default}
@keyframes stamp{0%{opacity:0;transform:scale(2.2) rotate(-8deg)}60%{opacity:1;transform:scale(.92) rotate(-2deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.flash.go{animation:popIn .4s ease-out both}
.flash.go .kw span{animation:stamp .5s cubic-bezier(.2,1.2,.4,1) both}
.flash.blank .kw span{color:transparent!important;background:rgba(224,168,78,.14);border-color:var(--gold)!important;cursor:pointer}
.flash.blank .kw span.show{color:inherit!important;background:none}
.flash .x{position:absolute;right:6px;top:4px;background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:4px}
.stepbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:5px;pointer-events:none}
.stepbar i{width:16px;height:3px;border-radius:2px;background:var(--line2);transition:background .3s}
.stepbar i.on{background:var(--gold)}
.replay{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:132px;width:34px;height:34px;border-radius:6px;background:rgba(21,24,29,.9);border:1px solid var(--line2);cursor:pointer;color:var(--gold);font-size:13px;display:grid;place-items:center;padding:0}
.replay:hover{border-color:var(--gold)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card.anim>*{animation:rise .45s ease-out both}
.card.anim>*:nth-child(2){animation-delay:.05s}.card.anim>*:nth-child(3){animation-delay:.1s}.card.anim>*:nth-child(4){animation-delay:.15s}
.card.anim>*:nth-child(5){animation-delay:.25s}.card.anim>*:nth-child(6){animation-delay:.35s}.card.anim>*:nth-child(7){animation-delay:.45s}.card.anim>*:nth-child(n+8){animation-delay:.55s}
/* ---------- 串线 / 闯关 ---------- */
.tog.hot{color:var(--fg);border-color:var(--line2);font-weight:500}
.tog.hot[aria-pressed=true]{border-color:var(--gold);color:var(--gold);background:rgba(224,168,78,.08)}
.sep{width:1px;height:20px;background:var(--line2);margin:0 2px}
.mwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;width:300px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:0 18px 40px rgba(0,0,0,.5);padding:6px;max-height:70vh;overflow:auto}
.menu button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:5px;padding:8px 10px;cursor:pointer;font-size:13.5px;color:var(--fg2)}
.menu button:hover,.menu button.on{background:var(--raise);color:var(--fg)}
.menu button span{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.menu .mh{font-size:11px;color:var(--muted);letter-spacing:.14em;padding:6px 10px 4px}
.menu .off{color:var(--red)}
.thr{background:linear-gradient(180deg,rgba(224,168,78,.09),rgba(224,168,78,.02));border:1px solid rgba(224,168,78,.3);border-radius:8px;padding:11px 13px;margin-bottom:14px}
.thr .tn{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.1em}
.thr .tn span{color:var(--fg2);font-weight:500;letter-spacing:0;font-variant-numeric:tabular-nums}
.thr .ts{font-size:13px;line-height:1.75;color:var(--fg2);margin-top:6px}
.thr .tnote{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(224,168,78,.3);font-size:14px;font-weight:700}
.ch em{font-style:normal;font-size:11px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .an{font-style:normal;margin-left:6px;font-size:10px;color:var(--gold);font-weight:700}
.lens .arr{flex:none;align-self:center;color:var(--gold);opacity:.6;font-size:13px}
.lens .thrh{flex:none;display:flex;flex-direction:column;justify-content:center;gap:3px;padding-right:10px;border-right:1px solid var(--line2);max-width:150px}
.lens .thrh b{font-size:12.5px;color:var(--gold);line-height:1.35}
.lens .thrh button{align-self:flex-start;background:none;border:1px solid var(--line2);border-radius:4px;color:var(--fg2);font-size:11px;padding:1px 7px;cursor:pointer}
.tnum{font-family:var(--sans);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tl.quizzing .lens,.tl.quizzing .ov{opacity:.25;pointer-events:none}
.side.quizzing .nav{display:none}
#map.pick{cursor:crosshair}
.qz .qh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);letter-spacing:.08em}
.qz .qh b{color:var(--gold);font-weight:700}
.qz .bar{height:3px;background:var(--line);border-radius:2px;margin:8px 0 16px;overflow:hidden}
.qz .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .4s}
.qz .qt{font-size:12px;letter-spacing:.16em;color:var(--blue);font-weight:700}
.qz .qq{font-family:var(--serif);font-weight:900;font-size:21px;line-height:1.45;margin:8px 0 14px;text-wrap:balance}
.qz .clue{background:var(--raise);border-radius:6px;padding:10px 12px;font-size:14px;line-height:1.75;margin-bottom:14px}
.qz .clue mark{color:var(--fg)}
.qz .hint{font-size:13px;color:var(--fg2);display:flex;gap:8px;align-items:center;background:rgba(121,172,217,.08);border:1px dashed rgba(121,172,217,.4);border-radius:6px;padding:10px 12px}
.qz .opts{display:grid;gap:8px}
.qz .opt{display:flex;gap:10px;align-items:center;text-align:left;background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:11px 12px;cursor:pointer;font-size:14.5px;color:var(--fg)}
.qz .opt:hover{border-color:var(--line2)}
.qz .opt .n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--panel);color:var(--muted);border:1px solid var(--line2)}
.qz .opt.sel .n{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.qz .opt.ok{border-color:var(--jade);background:rgba(95,191,157,.1)}
.qz .opt.bad{border-color:var(--red);background:rgba(222,90,67,.1)}
.qz .opt .dd{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.qz .fb{margin-top:14px;border-radius:7px;padding:12px 13px;font-size:14px;line-height:1.7;animation:rise .35s ease-out both}
.qz .fb.ok{background:rgba(95,191,157,.1);border:1px solid rgba(95,191,157,.4)}
.qz .fb.bad{background:rgba(222,90,67,.08);border:1px solid rgba(222,90,67,.35)}
.qz .fb b.v{display:block;font-size:15px;margin-bottom:4px}
.qz .fb.ok b.v{color:var(--jade)} .qz .fb.bad b.v{color:var(--red)}
.qz .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

  const seg=[0];for(let i=1;i<pts.length;i++)seg.push(seg[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));const L=seg[seg.length-1]||1;

  return new Promise(res=>{const t0=performance.now();(function f(now){if(tok!==sceneTok){pl.setAttribute('points',pts.map(p=>p.join(',')).join(' '));return res()}
    const d=ease(Math.min(1,(now-t0)/dur))*L;const out=[pts[0]];let i=1;while(i<pts.length&&seg[i]<=d){out.push(pts[i]);i++}

/* 动画演示 */
async function playScene(e){
  const tok=++sceneTok;resetFx();drawDots();faintRoutes(e);drawThread(e);$('#flash').hidden=true;
  const steps=stepsFor(e),c0=KIND[e.k].c;
  await fly(boxFor(scenePoints(e).concat(st.thread?st.thread.list().filter(x=>x.pl.length).map(x=>PL[x.pl[0]]):[])),900);if(tok!==sceneTok)return;
  if(e.pv.length){highlight(e.pv,c0,true);await wait(steps.length?250:700);if(tok!==sceneTok)return}
  let prev=null;
  for(const [i,s] of steps.entries()){const o=s[3]||{},p=pos(s[0]),c=colorOf(s,e);if(!p)continue;
    stepBar(steps.length,i);
    const from=o.from?pos(o.from):prev;
    if(from&&!o.nl&&!o.dot){await drawLine([from,p],c,Math.min(1100,250+Math.hypot(p[0]-from[0],p[1]-from[1])*4),true);if(tok!==sceneTok)return}
    if(o.pv)highlight(o.pv,c,true);
    marker(p,c,i===steps.length-1||o.big);
    if(s[2]&&s[2].trim())callout(p,s[1],s[2],c,o.big);
    await wait(o.dot?380:(o.big?1500:1050));if(tok!==sceneTok)return;
    prev=p}
  if(!SCENES[e.t]&&e.r){for(const l of RT[e.r]){await drawLine(l,c0,1800);if(tok!==sceneTok)return}}
  if(lastCo)lastCo.classList.remove('small');
  const n=flashCard(e,true);
  await wait(600+n*320+1600);if(tok!==sceneTok)return;
  sceneEnd();
}

function toSvg(cx,cy){const r=svg.getBoundingClientRect();const sc=Math.max(vb.w/r.width,vb.h/r.height);const ox=(r.width-vb.w/sc)/2,oy=(r.height-vb.h/sc)/2;return[vb.x+(cx-r.left-ox)*sc,vb.y+(cy-r.top-oy)*sc]}
svg.addEventListener('wheel',ev=>{ev.preventDefault();const [x,y]=toSvg(ev.clientX,ev.clientY);zoomAt(x,y,Math.exp(ev.deltaY*.0018))},{passive:false});
const ptr=new Map();let moved=0,pinch=null;
svg.addEventListener('pointerdown',ev=>{svg.setPointerCapture(ev.pointerId);ptr.set(ev.pointerId,[ev.clientX,ev.clientY]);moved=0;flyTok++;if(ptr.size===2){const [a,b]=[...ptr.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])}}});
svg.addEventListener('pointermove',ev=>{
  if(!ptr.has(ev.pointerId)){hoverTip(ev);return}
  const prev=ptr.get(ev.pointerId);ptr.set(ev.pointerId,[ev.clientX,ev.clientY]);
  if(ptr.size===2&&pinch){const [a,b]=[...ptr.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const [x,y]=toSvg((a[0]+b[0])/2,(a[1]+b[1])/2);zoomAt(x,y,pinch.d/d);pinch.d=d;moved=99;return}
  const r=svg.getBoundingClientRect(),sc=Math.max(vb.w/r.width,vb.h/r.height);
  const dx=ev.clientX-prev[0],dy=ev.clientY-prev[1];moved+=Math.abs(dx)+Math.abs(dy);
  if(moved>4){svg.classList.add('drag');vb.x-=dx*sc;vb.y-=dy*sc;applyVB()}});
function up(ev){if(!ptr.has(ev.pointerId))return;ptr.delete(ev.pointerId);if(ptr.size<2)pinch=null;svg.classList.remove('drag');
  if(moved<=4&&ev.type==='pointerup'&&quiz.on){if(quiz.q&&quiz.q.type==='loc'&&!quiz.done)answerLoc(toSvg(ev.clientX,ev.clientY));return}
  if(moved<=4&&ev.type==='pointerup'){const g=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.pd');if(g)pickPlace(g.dataset.n)}}

  try{localStorage.setItem('sgmap.cur',e.t)}catch(x){}}
function step(d){const vis=EV.filter(visible),k=vis.findIndex(x=>x.id===st.cur);if(k<0){vis.length&&go(vis[0].id);return}const n=vis[k+d];if(n)go(n.id);else if(d>0)stopPlay()}
function manual(){stopPlay()}

/* 筛选 */
const erasNav=$('#eras');
['全部','旧民主主义','新民主主义','社会主义建设','改革开放','新时代'].forEach((n,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.setAttribute('aria-pressed',i===0);
  b.onclick=()=>{if(st.thread){st.thread=null;$('#tThread').setAttribute('aria-pressed','false')}st.era=i-1;erasNav.querySelectorAll('.chip').forEach((x,j)=>x.setAttribute('aria-pressed',j===i));refilter()};erasNav.appendChild(b)});
const lgd=$('#legend');
Object.entries(KIND).forEach(([k,v])=>{const b=document.createElement('button');b.className='lg';b.style.setProperty('--c',v.c);b.innerHTML=`<i></i>${v.n}`;b.setAttribute('aria-pressed','true');b.title='点击只看/隐藏这一类';
  b.onclick=()=>{if(st.kinds.size===4){st.kinds=new Set([k])}else if(st.kinds.has(k)){st.kinds.delete(k);if(!st.kinds.size)st.kinds=new Set(Object.keys(KIND))}else st.kinds.add(k);
    lgd.querySelectorAll('.lg').forEach((x,i)=>x.setAttribute('aria-pressed',st.kinds.has(Object.keys(KIND)[i])));refilter()};lgd.appendChild(b)});
function refilter(){manual();buildLens();lensUser=0;if(!visible(EV[st.cur])){const v=EV.filter(visible);if(v.length){const cy=EV[st.cur].y;let b=v[0];for(const e of v)if(Math.abs(e.y-cy)<Math.abs(b.y-cy))b=e;go(b.id);return}}go(st.cur,{quick:true})}
$('#tFav').onclick=function(){if(!st.fav&&!FAV.size){this.querySelector('.dot').animate([{transform:'scale(1)'},{transform:'scale(2)'},{transform:'scale(1)'}],400);return}st.fav=!st.fav;this.setAttribute('aria-pressed',st.fav);refilter()};
function setBlank(v){st.blank=v;$('#tBlank').setAttribute('aria-pressed',v);$('#card').classList.toggle('blank',v);$('#flash').classList.toggle('blank',v);document.querySelectorAll('mark.show,.kw span.show').forEach(m=>m.classList.remove('show'))}
$('#tBlank').onclick=()=>setBlank(!st.blank);
$('#tDemo').setAttribute('aria-pressed',st.demo);
$('#tDemo').onclick=function(){st.demo=!st.demo;this.setAttribute('aria-pressed',st.demo);try{localStorage.setItem('sgmap.demo',st.demo?'1':'0')}catch(e){}if(st.demo)playScene(EV[st.cur]);else renderStatic(EV[st.cur],false)};
function stopPlay(){if(st.play){st.play=false;$('#tPlay').setAttribute('aria-pressed','false')}}
function togglePlay(){if(st.play){stopPlay();return}st.play=true;$('#tPlay').setAttribute('aria-pressed','true');step(1)}
$('#tPlay').onclick=togglePlay;

/* 重要度筛选 */
const tLv=$('#tLv');const LVB={1:'全部节点',2:'★★ 重要以上',3:'★★★ 只看必背'};
function paintLv(){tLv.textContent=LVB[st.minLv];tLv.dataset.lv=st.minLv}
tLv.onclick=()=>{st.minLv=st.minLv%3+1;try{localStorage.setItem('sgmap.lv',st.minLv)}catch(e){}paintLv();if(st.thread){st.thread=null;$('#tThread').setAttribute('aria-pressed','false')}refilter()};
paintLv();
/* 串线菜单 */
const menu=$('#menu');
function buildMenu(){menu.innerHTML='<div class="mh">把分散的节点串成一条线</div>'+THREADS.map(T=>`<button data-t="${T.id}" class="${st.thread===T?'on':''}">${esc(T.n)}<span>${T.ev.length}</span></button>`).join('')+(st.thread?'<button data-t="" class="off">退出串线</button>':'')}
$('#tThread').onclick=ev=>{ev.stopPropagation();buildMenu();menu.hidden=!menu.hidden};
menu.addEventListener('click',ev=>{const b=ev.target.closest('[data-t]');if(!b)return;menu.hidden=true;setThread(THREADS.find(T=>T.id===b.dataset.t)||null)});
document.addEventListener('pointerdown',ev=>{if(!ev.target.closest('.mwrap'))menu.hidden=true});
function setThread(T){manual();if(quiz.on)quitQuiz();st.thread=T;$('#tThread').setAttribute('aria-pressed',!!T);
  if(T){st.era=-1;st.fav=false;st.kinds=new Set(Object.keys(KIND));erasNav.querySelectorAll('.chip').forEach((x,j)=>x.setAttribute('aria-pressed',j===0));lgd.querySelectorAll('.lg').forEach(x=>x.setAttribute('aria-pressed','true'));$('#tFav').setAttribute('aria-pressed','false')}
  buildLens();lensUser=0;
  if(T){const L=T.list();if(L.length)go(L[0].id)}else go(st.cur,{quick:true})}

/* ===== 闯关测验 ===== */
const WEAK=ld('sgmap.weak');
const quiz={on:false,qs:[],i:0,score:0,wrong:[],q:null,done:false,weakOnly:false};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const TYPE={loc:'定位题',yr:'时间题',id:'辨识题',ord:'排序题'};
function scopeName(){return st.thread?'专题 · '+st.thread.n:st.era>=0?ERAS[st.era].n:'全部时期'}
function makeQs(pool,n=10){
  const used=new Set(),qs=[];
  const P={loc:shuffle(pool.filter(e=>e.pl.length&&e.pl.length<=4&&!e.pv.includes('ALL'))),
           yr:shuffle(pool.filter(e=>/^\d{4}(\.\d{1,2})?(\.\d{1,2})?$/.test(e.d.trim()))),
           id:shuffle(pool.filter(e=>e.pts.some(l=>/==/.test(l))))};
  const plan=['loc','yr','id','ord','loc','id','yr','loc','ord','id','loc','yr'];
  for(const ty of plan){if(qs.length>=n)break;
    if(ty==='ord'){const c=shuffle(pool.filter(e=>!used.has(e.id)));const pick=[];for(const e of c){if(pick.every(p=>Math.abs(p.y-e.y)>=1))pick.push(e);if(pick.length===4)break}
      if(pick.length===4){qs.push({type:'ord',evs:pick});continue}}
    const e=(P[ty]||[]).find(x=>!used.has(x.id));if(!e)continue;used.add(e.id);
    if(ty==='loc')qs.push({type:'loc',e});
    if(ty==='yr'){const y=Y0(e);const ds=shuffle([-6,-4,-3,-2,-1,1,2,3,4,6].filter(d=>y+d<=2026)).slice(0,3);qs.push({type:'yr',e,opts:shuffle([y,...ds.map(d=>y+d)]),ans:y})}
    if(ty==='id'){const others=shuffle(EV.filter(x=>x.id!==e.id&&x.era===e.era&&x.k===e.k)).concat(shuffle(EV.filter(x=>x.id!==e.id&&x.era===e.era))).filter((x,i,a)=>a.indexOf(x)===i).slice(0,3);
      const words=e.t.replace(/[《》“”（）·\s]/g,'').match(/[一-龥]{2}/g)||[];
      const lines=shuffle(e.pts.filter(l=>/==/.test(l)&&!words.some(w=>l.includes(w)))).slice(0,2);if(!lines.length||others.length<3)continue;
      qs.push({type:'id',e,lines,opts:shuffle([e,...others])})}}
  return qs}
function startQuiz(weakOnly){
  const pool=weakOnly?EV.filter(e=>WEAK.has(e.t)):EV.filter(visible);
  if(pool.length<4){quizIntro('这个范围里的节点太少了（少于 4 个），换个范围或先去掉筛选再试。');return}
  Object.assign(quiz,{on:true,qs:makeQs(pool,weakOnly?Math.min(10,Math.max(4,pool.length)):10),i:0,score:0,wrong:[],weakOnly});
  if(!quiz.qs.length){quizIntro('这个范围出不了题，换个范围试试。');return}
  showQ()}
function enterQuiz(){manual();quiz.on=true;$('#tQuiz').setAttribute('aria-pressed','true');$('.tl').classList.add('quizzing');$('.side').classList.add('quizzing');quizIntro()}
function quitQuiz(){quiz.on=false;quiz.q=null;$('#tQuiz').setAttribute('aria-pressed','false');$('.tl').classList.remove('quizzing');$('.side').classList.remove('quizzing');svg.classList.remove('pick');go(st.cur,{quick:true})}
$('#tQuiz').onclick=()=>quiz.on?quitQuiz():enterQuiz();
function qHud(t1,t2,t3){$('#yr').innerHTML=t1;$('#eraName').textContent=t2;$('#segName').textContent=t3||'';$('#abroad').hidden=true}
function blankMap(){sceneTok++;resetFx();$('#flash').hidden=true;clear($('#gDot'));fly({x:0,y:0,w:MAP.w,h:H0},600)}
function quizIntro(msg){quiz.q=null;blankMap();qHud('闯关','地图闯关测验','');svg.classList.remove('pick');
  $('#card').innerHTML=`<div class="qz"><div class="qt">地图闯关</div><div class="qq">10 道题，把时间、地点、意义串起来考一遍</div>
  ${msg?`<div class="fb bad">${esc(msg)}</div>`:''}
  <p>出题范围：<b style="color:var(--gold)">${esc(scopeName())}</b>（${EV.filter(visible).length} 个节点）。想只考一个时期或一条专题线，先在顶部选好再来。</p>
  <ul><li><b>定位题</b>：在地图上点出事件发生地</li><li><b>时间题</b>：选出发生的年份</li><li><b>辨识题</b>：看描述认事件</li><li><b>排序题</b>：把 4 件事按先后排好</li></ul>
  <p>答错的节点会自动进入错题本，之后可以单独练。</p>
  <div class="row"><button class="btn pri" id="qGo">开始闯关</button><button class="btn" id="qWeak" ${WEAK.size?'':'disabled'}>只练错题（${WEAK.size}）</button></div>
  <div class="row"><button class="btn" id="qQuit">退出</button></div></div>`;
  $('#qGo').onclick=()=>startQuiz(false);$('#qWeak').onclick=()=>startQuiz(true);$('#qQuit').onclick=quitQuiz}
function qHead(){const n=quiz.qs.length,i=quiz.i;return `<div class="qh"><span>第 <b>${i+1}</b> / ${n} 题 · ${esc(quiz.weakOnly?'错题本':scopeName())}</span><span>得分 <b>${quiz.score}</b></span></div><div class="bar"><i style="width:${i/n*100}%"></i></div>`}
function showQ(){const q=quiz.qs[quiz.i];quiz.q=q;quiz.done=false;blankMap();qHud(`${quiz.i+1}<small>/${quiz.qs.length}</small>`,TYPE[q.type],'得分 '+quiz.score);
  let h=`<div class="qz">${qHead()}<div class="qt">${TYPE[q.type]}</div>`;
  if(q.type==='loc'){h+=`<div class="qq">「${esc(q.e.t)}」发生在哪里？</div><div class="clue">${esc(q.e.d)} · ${esc(ERAS[q.e.era].n)}</div><div class="hint">👆 直接在左边地图上点出位置（可以先缩放）</div>`;svg.classList.add('pick')}
  else svg.classList.remove('pick');
  if(q.type==='yr')h+=`<div class="qq">「${esc(q.e.t)}」发生在哪一年？</div><div class="opts">${q.opts.map((y,i)=>`<button class="opt" data-v="${y}"><span class="n">${i+1}</span>${y} 年</button>`).join('')}</div>`;
  if(q.type==='id')h+=`<div class="qq">下面说的是哪件事？</div><div class="clue">${q.lines.map(fmt).join('<br>')}</div><div class="opts">${q.opts.map((e,i)=>`<button class="opt" data-v="${e.id}"><span class="n">${i+1}</span>${esc(e.t)}</button>`).join('')}</div>`;
  if(q.type==='ord'){q.pick=[];h+=`<div class="qq">按发生先后依次点击</div><div class="opts">${q.evs.map((e,i)=>`<button class="opt" data-v="${e.id}"><span class="n">·</span>${esc(e.t)}<span class="dd"></span></button>`).join('')}</div>`}
  h+=`<div id="qfb"></div></div>`;$('#card').innerHTML=h;$('#card').scrollTop=0;
  document.querySelectorAll('.qz .opt').forEach(b=>b.onclick=()=>onOpt(b))}
function onOpt(b){const q=quiz.q;if(quiz.done)return;
  if(q.type==='yr')judge(+b.dataset.v===q.ans,[q.e],()=>document.querySelectorAll('.qz .opt').forEach(x=>{x.classList.toggle('ok',+x.dataset.v===q.ans);if(x===b&&+x.dataset.v!==q.ans)x.classList.add('bad')}));
  if(q.type==='id')judge(+b.dataset.v===q.e.id,[q.e],()=>document.querySelectorAll('.qz .opt').forEach(x=>{x.classList.toggle('ok',+x.dataset.v===q.e.id);if(x===b&&+x.dataset.v!==q.e.id)x.classList.add('bad')}));
  if(q.type==='ord'){const id=+b.dataset.v,k=q.pick.indexOf(id);if(k>=0)q.pick.splice(k,1);else q.pick.push(id);
    document.querySelectorAll('.qz .opt').forEach(x=>{const j=q.pick.indexOf(+x.dataset.v);x.classList.toggle('sel',j>=0);x.querySelector('.n').textContent=j>=0?j+1:'·'});
    if(q.pick.length===4){const right=[...q.evs].sort((a,b)=>a.y-b.y).map(e=>e.id);const ok=right.every((id,i)=>q.pick[i]===id);
      judge(ok,q.evs,()=>document.querySelectorAll('.qz .opt').forEach(x=>{const id=+x.dataset.v,ri=right.indexOf(id);x.querySelector('.dd').textContent=`第 ${ri+1} · ${EV[id].d}`;x.classList.add(q.pick.indexOf(id)===ri?'ok':'bad')}))}}}
function answerLoc(p){const q=quiz.q,e=q.e;let best=null,bd=1e9;for(const n of e.pl){const c=PL[n],d=Math.hypot(c[0]-p[0],c[1]-p[1]);if(d<bd){bd=d;best=c}}
  const lat=40,km=Math.round(bd/MAP.k*6371*Math.cos(lat*Math.PI/180));const ok=bd<=34;
  const gx=fixed($('#gFx'),p[0],p[1]);mk('path',{d:'M-6,-6L6,6M-6,6L6,-6',stroke:'#fff','stroke-width':2.4,'stroke-linecap':'round'},gx);
  drawLine([p,best],ok?'var(--jade)':'var(--red)',500,false);
  e.pl.forEach((n,i)=>{marker(PL[n],KIND[e.k].c,i===0)});callout(e.pl.length?PL[e.pl[0]]:best,e.d,e.pl.join('、'),KIND[e.k].c,true);
  fly(boxFor([p,...e.pl.map(n=>PL[n])],520),800);svg.classList.remove('pick');
  judge(ok,[e],null,ok?`相差约 ${km} 公里，位置对了。`:`相差约 ${km} 公里。正确地点：${e.pl.join('、')}。`)}
function judge(ok,evs,mark,extra){quiz.done=true;mark&&mark();if(ok)quiz.score++;
  evs.forEach(e=>{if(ok)WEAK.delete(e.t);else WEAK.add(e.t)});if(!ok)quiz.wrong.push(...evs.filter(e=>!quiz.wrong.includes(e)));sv('sgmap.weak',WEAK);
  const e=evs[0],q=quiz.q,mean=e.pts.find(l=>/^意义/.test(l))||e.pts[0]||'';
  let body=q.type==='ord'?[...evs].sort((a,b)=>a.y-b.y).map((x,i)=>`${i+1}. ${esc(x.d)}　${esc(x.t)}`).join('<br>'):`<b>${esc(e.d)}　${esc(e.t)}</b><br>${fmt(mean)}`;
  const last=quiz.i>=quiz.qs.length-1;
  $('#qfb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b class="v">${ok?'✓ 答对了':'✗ 记一下'}</b>${extra?esc(extra)+'<br>':''}${body}</div>
   <div class="row">${q.type!=='ord'?'<button class="btn" id="qDemo">▶ 看演示</button>':''}<button class="btn pri" id="qNext">${last?'看成绩':'下一题'}</button></div>`;
  qHud(`${quiz.i+1}<small>/${quiz.qs.length}</small>`,TYPE[q.type],'得分 '+quiz.score);
  const d=$('#qDemo');if(d)d.onclick=()=>{playScene(e)};
  $('#qNext').onclick=()=>{if(last)endQuiz();else{quiz.i++;showQ()}};
  if(q.type==='loc'&&!ok){}}
function endQuiz(){quiz.q=null;blankMap();const n=quiz.qs.length,s=quiz.score,pct=s/n;
  qHud(`${s}<small>/${n}</small>`,'闯关完成','');
  const W_=[...new Set(quiz.wrong)];
  $('#card').innerHTML=`<div class="qz"><div class="qt">闯关完成</div><div class="big" style="margin:12px 0 6px">${s}<small> / ${n}</small></div>
  <p>${pct>=.9?'很扎实，可以换个时期或专题继续。':pct>=.6?'基本掌握了，把下面的错题过一遍演示再来一轮。':'先用「连播 + 演示」把这一段完整看一遍，再回来闯关。'}</p>
  ${W_.length?`<div class="sec"><h3>这轮答错的</h3><div class="list">${W_.map(x=>`<button data-qid="${x.id}"><span class="d">${esc(x.d)}</span><span>${esc(x.t)}</span></button>`).join('')}</div></div>`:''}
  <div class="row"><button class="btn pri" id="qAgain">再来一轮</button><button class="btn" id="qWeak" ${WEAK.size?'':'disabled'}>练错题本（${WEAK.size}）</button></div>
  <div class="row"><button class="btn" id="qQuit">退出闯关</button></div></div>`;
  $('#qAgain').onclick=()=>startQuiz(quiz.weakOnly&&WEAK.size>=4);$('#qWeak').onclick=()=>startQuiz(true);$('#qQuit').onclick=quitQuiz;
  document.querySelectorAll('[data-qid]').forEach(b=>b.onclick=()=>{const id=+b.dataset.qid;quitQuiz();go(id)})}

/* 搜索 */
const q=$('#q'),res=$('#res');let hits=[],hi=0;
function search(){const s=q.value.trim();if(!s){res.hidden=true;return}
  const ks=s.split(/\s+/);hits=EV.filter(e=>{const hay=(e.d+e.t+e.pl.join('')+e.ab+e.ph+e.pts.join('')).replace(/==/g,'');return ks.every(k=>hay.includes(k))});
  hits.sort((a,b)=>(b.t.includes(s)?1:0)-(a.t.includes(s)?1:0));hits=hits.slice(0,14);hi=0;
  res.innerHTML=hits.length?hits.map((e,i)=>`<button data-id="${e.id}" class="${i===0?'on':''}"><span class="d">${esc(e.d)}</span><span>${esc(e.t)}</span></button>`).join(''):'<div class="empty">没有找到，换个关键词试试</div>';res.hidden=false}
q.addEventListener('input',search);q.addEventListener('focus',search);
q.addEventListener('keydown',ev=>{if((ev.key==='ArrowDown'||ev.key==='ArrowUp')&&hits.length){ev.preventDefault();hi=(hi+(ev.key==='ArrowDown'?1:-1)+hits.length)%hits.length;res.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===hi))}
  if(ev.key==='Enter'&&hits[hi]){pickHit(hits[hi].id)}if(ev.key==='Escape'){q.blur();res.hidden=true}});
res.addEventListener('pointerdown',ev=>{const b=ev.target.closest('[data-id]');if(b){ev.preventDefault();pickHit(+b.dataset.id)}});
function pickHit(id){manual();if(quiz.on)quitQuiz();if(!visible(EV[id])){st.thread=null;$('#tThread').setAttribute('aria-pressed','false');st.era=-1;st.fav=false;st.kinds=new Set(Object.keys(KIND));erasNav.querySelectorAll('.chip').forEach((x,j)=>x.setAttribute('aria-pressed',j===0));lgd.querySelectorAll('.lg').forEach(x=>x.setAttribute('aria-pressed','true'));$('#tFav').setAttribute('aria-pressed','false');buildLens()}
  lensUser=0;go(id);res.hidden=true;q.blur()}
document.addEventListener('pointerdown',ev=>{if(!ev.target.closest('.search'))res.hidden=true});

/* 键盘 */
addEventListener('keydown',ev=>{if(ev.target.matches('input'))return;
  if(quiz.on){if(ev.key==='Escape')quitQuiz();else if(/^[1-4]$/.test(ev.key)){const b=document.querySelectorAll('.qz .opt')[+ev.key-1];b&&b.click()}else if(ev.key==='Enter'){const b=document.querySelector('.qz .btn.pri');b&&!b.disabled&&b.click()}return}
  if(ev.key==='ArrowRight'||ev.key==='k'||ev.key==='K'){ev.preventDefault();manual();lensUser=0;step(1)}
  else if(ev.key==='ArrowLeft'||ev.key==='j'||ev.key==='J'){ev.preventDefault();manual();lensUser=0;step(-1)}
  else if(ev.key===' '){ev.preventDefault();togglePlay()}
  else if(ev.key==='/'){ev.preventDefault();q.focus()}
  else if(ev.key==='b'||ev.key==='B'){setBlank(!st.blank)}
  else if(ev.key==='r'||ev.key==='R'){playScene(EV[st.cur])}
  else if(ev.key==='0'){fitAll()}});

/* 启动 */
counts();buildOverview();buildLens();applyVB();
let start=EV.findIndex(e=>e.t.includes('八国联军'));
try{const t=localStorage.getItem('sgmap.cur');const i=EV.findIndex(e=>e.t===t);if(i>=0)start=i}catch(e){}
go(start<0?0:start);
</script>
