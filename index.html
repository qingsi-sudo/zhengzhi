<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>政治大题默写本</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: 左侧目录树 + 右侧单考点默写纸；挖空=下划线，揭晓=朱批红笔 */
:root{
  --paper:#f5f6f3; --sheet:#fffffe; --ink:#1f2328; --ink2:#5b6168; --rule:#d9ddd6; --line:#c5cbc2;
  --zhu:#b3261e; --zhu-soft:#f6e4e1; --ok:#2f6b3f; --ok-soft:#e2efe4; --warn:#9a6a12; --warn-soft:#f6ecd6;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif; --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15171a; --sheet:#1c1f23; --ink:#e7e8e6; --ink2:#a2a8ad; --rule:#2d3237; --line:#4a5157;
  --zhu:#ff7b6e; --zhu-soft:#3a201e; --ok:#7cc48c; --ok-soft:#1d2e22; --warn:#e3b45c; --warn-soft:#33291a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15171a; --sheet:#1c1f23; --ink:#e7e8e6; --ink2:#a2a8ad; --rule:#2d3237; --line:#4a5157;
  --zhu:#ff7b6e; --zhu-soft:#3a201e; --ok:#7cc48c; --ok-soft:#1d2e22; --warn:#e3b45c; --warn-soft:#33291a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,.b:focus-visible{outline:2px solid var(--zhu);outline-offset:2px}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100%}
/* sidebar */
.side{border-right:1px solid var(--rule);overflow-y:auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px;background:var(--paper)}
.brand{font-family:var(--serif);font-weight:900;font-size:22px;letter-spacing:.04em;margin:0 0 4px}
.brand small{display:block;font-family:var(--sans);font-weight:400;font-size:12px;color:var(--ink2);letter-spacing:0;margin-top:4px}
.prog{margin:14px 0 18px;display:grid;gap:6px}
.prog .bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;display:flex}
.prog .bar i{display:block;height:100%}
.prog .bar .g{background:var(--ok)} .prog .bar .y{background:var(--warn)}
.sync::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--line);margin-right:6px;transform:translateY(-1px)}
.sync.on::before{background:var(--ok)}
.prog .txt{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.subj{margin-top:10px}
.subj>button{width:100%;text-align:left;background:none;border:0;padding:8px 4px;font-family:var(--serif);font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.subj>button .cnt{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.subj.closed .tlist{display:none}
.tname{font-size:12px;letter-spacing:.08em;color:var(--ink2);margin:8px 0 2px 6px}
.plist{list-style:none;margin:0;padding:0}
.plist button{width:100%;display:flex;gap:8px;align-items:baseline;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px;font-size:13.5px;line-height:1.4;color:var(--ink)}
.plist button:hover{background:var(--sheet)}
.plist button.cur{background:var(--sheet);box-shadow:inset 3px 0 0 var(--zhu);font-weight:500}
.dot{flex:none;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line);transform:translateY(-1px)}
.dot.s1{background:var(--warn);border-color:var(--warn)} .dot.s2{background:var(--ok);border-color:var(--ok)}
/* main */
.main{overflow-y:auto;min-width:0}
.bar-top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tbtn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 12px;font-size:13px;white-space:nowrap}
.tbtn:hover{border-color:var(--ink2)}
.menu-btn{display:none}
.spacer{flex:1}
.wrap{padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{max-width:860px;margin:0 auto;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:36px clamp(18px,5vw,56px) 40px}
.crumb{font-size:12px;color:var(--ink2);letter-spacing:.06em;display:flex;flex-wrap:wrap;gap:6px}
.crumb span+span::before{content:"›";margin-right:6px;color:var(--line)}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(22px,3.2vw,30px);line-height:1.35;margin:10px 0 6px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:12.5px;color:var(--ink2);padding-bottom:18px;border-bottom:1px solid var(--rule);margin-bottom:22px;font-variant-numeric:tabular-nums}
.modehint{font-size:12.5px;color:var(--ink2);background:var(--paper);border-radius:6px;padding:8px 12px;margin-bottom:22px;line-height:1.6}
.p{font-family:var(--serif);font-size:17px;line-height:2.25;margin:0 0 18px;max-width:46em}
.p .lb{font-family:var(--sans);font-weight:700;font-size:15px;color:var(--ink)}
.p.meth{border-top:1px dashed var(--line);padding-top:14px}
.p.meth .lb{color:var(--zhu)}
.br{display:block;height:0}
.b{color:transparent;border-bottom:1.5px solid var(--ink2);cursor:pointer;border-radius:2px;padding:0 1px;transition:background .15s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.b+.b{margin-left:4px}
.b:hover{background:var(--zhu-soft)}
.b.on{color:var(--zhu);border-bottom-color:var(--zhu);background:var(--zhu-soft)}
.b::selection{color:transparent}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:32px;padding-top:18px;border-top:1px solid var(--rule)}
.status{display:flex;gap:6px;flex-wrap:wrap}
.status button{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 14px;font-size:13px}
.status button[aria-pressed="true"].s0{background:var(--rule)}
.status button[aria-pressed="true"].s1{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.status button[aria-pressed="true"].s2{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.nav{display:flex;gap:8px}
.keys{max-width:860px;margin:14px auto 0;font-size:12px;color:var(--ink2);text-align:center}
kbd{font-family:var(--sans);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px}
.scrim{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:20;transform:translateX(-100%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px));box-shadow:0 0 40px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.3)}
  .menu-btn{display:inline-block}
  .bar-top{top:env(safe-area-inset-top,0px)}
  .p{font-size:16px;line-height:2.15}
  .keys{display:none}
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <p class="brand">政治大题默写本<small>2027 考研政治大题必背 · 共 <span id="totalN"></span> 个考点</small></p>
    <div class="prog"><div class="bar"><i class="g" id="pg"></i><i class="y" id="py"></i></div><div class="txt" id="ptxt"></div><div class="txt">进度保存在当前浏览器</div></div>
    <nav id="tree"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="main">
    <div class="bar-top"><div class="bar-in">
      <button class="tbtn menu-btn" id="menuBtn">目录</button>

    </div>
  </main>
</div>

const PUNC=/[，。；：、！？,.;:（）()“”《》—\s]/;
const CIR='①②③④⑤⑥⑦⑧⑨⑩';

function maskFor(par){
  const txt=par.r.map(x=>x[0]).join(''), n=txt.length, m=new Array(n).fill(0), le=par.le;
  if(mode==1||mode==2){let i=0,g=0;par.r.forEach(([s,f])=>{g++;for(let k=0;k<s.length;k++){m[i]=f?(mode==1&&k==0&&s.length>1?0:g):0;i++}})}
  else if(mode==3){
    const vis=new Array(n).fill(0);
    for(let i=0;i<le;i++)vis[i]=1;
    const mark=(re)=>{let x;re.lastIndex=0;while((x=re.exec(txt)))for(let i=x.index;i<x.index+x[0].length;i++)vis[i]=1};
    mark(/[①②③④⑤⑥⑦⑧⑨⑩](?:[^，。；：①-⑩]{1,12}：)?/g);
    mark(/第[一二三四五六七八九十]+，|[一二三四五六]是/g);
    mark(/方法论意义：/g);
    mark(/(?<=[。；])[^，。；：、①-⑩]{2,16}[：:]/g);
    if(false){
      let i=le;
      while(i<n){
        while(i<n&&(PUNC.test(txt[i])||vis[i]))i++;
        let k=0;
        while(i<n&&!PUNC.test(txt[i])){ if(!vis[i]){ if(k<2)vis[i]=1; k++; } i++; }
      }
    }
    for(let i=0;i<n;i++)m[i]=(vis[i]||PUNC.test(txt[i])||/[0-9\-－%=+]/.test(txt[i])&&mode==3&&false)?0:1;
    for(let i=0;i<n;i++)if(PUNC.test(txt[i]))m[i]=0;
  }
  return {txt,m};
}
function breaksAt(txt){
  const b=new Set(), circ=[...txt].filter(c=>CIR.includes(c)).length;
  for(let i=1;i<txt.length;i++){
    if(CIR.includes(txt[i])&&circ>=2)b.add(i);
    if(txt[i]==='第'&&/[一二三四五六七八九十]/.test(txt[i+1]||'')&&txt[i+2]==='，'&&/[。；）]/.test(txt[i-1]))b.add(i);
    if(/[一二三四五六]/.test(txt[i])&&txt[i+1]==='是'&&/[。；：]/.test(txt[i-1]))b.add(i);
    if(txt.startsWith('方法论意义',i))b.add(i);
  }
  return b;
}
function renderPar(par,idx){
  const {txt,m}=maskFor(par), br=breaksAt(txt), le=par.le;
  let h='',i=0;
  const meth=txt.startsWith('方法论意义');
  while(i<txt.length){
    if(br.has(i))h+='<span class="br"></span>';
    if(i<le){let j=Math.min(le,txt.length);h+=`<span class="lb">${esc(txt.slice(i,j))}</span>`;i=j;continue}
    let j=i+1;
    while(j<txt.length&&m[j]===m[i]&&!br.has(j)&&j<le===i<le)j++;
    const seg=txt.slice(i,j);
    h+=m[i]?`<span class="b" tabindex="0" role="button" aria-label="空格，${seg.length} 字">${esc(seg)}</span>`:esc(seg);
    i=j;
  }
  return `<p class="p${meth?' meth':''}">${h}</p>`;
}
function render(){
  const P=PTS[cur];
  const crumbs=[P.s.t,P.t.t,`考点 ${P.p.n}`].filter(Boolean);
  const html=P.p.paras.map(renderPar).join('');
  $('sheet').innerHTML=`
   <div class="crumb">${crumbs.map(c=>`<span>${esc(c)}</span>`).join('')}</div>
   <h1>${esc(P.p.t)}</h1>
   <div class="meta"><span>第 ${cur+1} / ${PTS.length} 个考点</span><span id="cnt"></span></div>
   <div class="modehint">${MODES[mode]}</div>
   ${html}
   <div class="foot">
     <div class="status" role="group" aria-label="掌握程度">
       <button class="s0" data-s="0">未背</button><button class="s1" data-s="1">背过，还不熟</button><button class="s2" data-s="2">已掌握</button>
     </div>
     <div class="nav"><button class="tbtn" id="prev">← 上一个</button><button class="tbtn" id="next">下一个 →</button></div>
   </div>`;
  const st=status[P.id]||0;
  document.querySelectorAll('.status button').forEach(b=>{b.setAttribute('aria-pressed',+b.dataset.s===st);b.onclick=()=>{status[P.id]=+b.dataset.s;store.set('zz-status',status);cloudSave();render();renderTree()}});
  $('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);
  $('prev').disabled=cur===0;$('next').disabled=cur===PTS.length-1;
  document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.m===mode));
  updCnt();
  document.querySelectorAll('.plist button').forEach(b=>b.classList.toggle('cur',b.dataset.id===P.id));
}
function updCnt(){
  const all=document.querySelectorAll('.b'),on=document.querySelectorAll('.b.on');
  const c=$('cnt'); if(!c)return;
  c.textContent=mode==0?'原文模式':`已核对 ${on.length} / ${all.length} 空`;
  $('toggleAll').textContent=all.length&&on.length===all.length?'隐藏全部答案':'显示全部答案';
  $('toggleAll').disabled=mode==0;
}
$('sheet').addEventListener('click',e=>{const b=e.target.closest('.b');if(b){b.classList.toggle('on');updCnt()}});
$('sheet').addEventListener('keydown',e=>{const b=e.target.closest('.b');if(b&&(e.key==='Enter')){b.classList.toggle('on');updCnt();e.preventDefault()}});
$('toggleAll').onclick=()=>{const all=[...document.querySelectorAll('.b')],show=all.some(b=>!b.classList.contains('on'));all.forEach(b=>b.classList.toggle('on',show));updCnt()};
$('seg').onclick=e=>{const b=e.target.closest('button');if(b)setMode(+b.dataset.m)};
function setMode(m){mode=m;store.set('zz-mode',m);render();cloudSave()}
$('rand').onclick=()=>{
  const pool=PTS.map((p,i)=>i).filter(i=>(status[PTS[i].id]||0)<2&&i!==cur);
  const arr=pool.length?pool:PTS.map((p,i)=>i);go(arr[Math.floor(Math.random()*arr.length)]);
};
function go(i){if(i<0||i>=PTS.length)return;cur=i;try{history.replaceState(null,'','#'+PTS[i].id)}catch(e){location.hash=PTS[i].id}render();$('main').scrollTop=0;closeSide()}
function renderTree(){
  const open=store.get('zz-open',{0:1});
  let h='';
  DATA.forEach((s,si)=>{
    const ids=PTS.filter(p=>p.si===si), done=ids.filter(p=>status[p.id]===2).length;
    h+=`<div class="subj${open[si]?'':' closed'}" data-si="${si}"><button aria-expanded="${!!open[si]}"><span>${esc(s.t)}</span><span class="cnt">${done}/${ids.length}</span></button><div class="tlist">`;
    s.topics.forEach((t,ti)=>{
      if(t.t)h+=`<div class="tname">${esc(t.t)}</div>`;
      h+='<ul class="plist">'+t.points.map((p,pi)=>{const id=`p-${si}-${ti}-${pi}`;return `<li><button data-id="${id}"><span class="dot s${status[id]||0}"></span><span>${esc(p.t)}</span></button></li>`}).join('')+'</ul>';
    });
    h+='</div></div>';
  });
  $('tree').innerHTML=h;
  const g=PTS.filter(p=>status[p.id]===2).length,y=PTS.filter(p=>status[p.id]===1).length;
  $('pg').style.width=g/PTS.length*100+'%';$('py').style.width=y/PTS.length*100+'%';
  $('ptxt').textContent=`已掌握 ${g} · 不熟 ${y} · 未背 ${PTS.length-g-y}`;
  $('totalN').textContent=PTS.length;
  document.querySelectorAll('.plist button').forEach(b=>b.classList.toggle('cur',b.dataset.id===PTS[cur].id));
}
$('tree').onclick=e=>{
  const pb=e.target.closest('.plist button');
  if(pb){go(PTS.findIndex(p=>p.id===pb.dataset.id));return}
  const sb=e.target.closest('.subj>button');
  if(sb){const si=sb.parentNode.dataset.si,o=store.get('zz-open',{0:1});o[si]=o[si]?0:1;store.set('zz-open',o);renderTree()}
};
function closeSide(){$('side').classList.remove('open');$('scrim').classList.remove('open')}
$('menuBtn').onclick=()=>{$('side').classList.add('open');$('scrim').classList.add('open')};
$('scrim').onclick=closeSide;
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);
  else if('0123'.includes(e.key)&&e.key.length===1)setMode(+e.key);
  else if(e.key==='a'||e.key==='A')$('toggleAll').click();
  else if(e.key===' '&&!e.target.closest('button,.b')){const n=document.querySelector('.b:not(.on)');if(n){n.classList.add('on');n.scrollIntoView({block:'nearest'});updCnt()}e.preventDefault()}
});
function fromHash(){const h=location.hash.slice(1),i=PTS.findIndex(p=>p.id===h);if(i>=0){cur=i;const o=store.get('zz-open',{0:1});o[PTS[i].si]=1;store.set('zz-open',o)}}
window.addEventListener('hashchange',()=>{fromHash();renderTree();render()});
fromHash();renderTree();render();

function cloudSave(){}
</script>
